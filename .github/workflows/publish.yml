name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Validate distribution metadata and installation
        run: |
          uv run --with twine twine check dist/*
          uv run python -m venv .artifact-venv
          .artifact-venv/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .artifact-venv/bin/python -c "import geoqc; print(geoqc.__version__)"
          .artifact-venv/bin/geoqc --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/geoqc/
    permissions:
      # Required for PyPI trusted publishing (no API token needed).
      # Configure this repository as a trusted publisher at
      # https://pypi.org/manage/project/geoqc/settings/publishing/ before
      # the first release.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
