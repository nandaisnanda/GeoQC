name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest

      - name: Audit dependencies
        # geoqc itself is unpublished, so pip-audit can't look it up on
        # PyPI; audit the resolved third-party dependencies only.
        run: |
          uv export --no-hashes --no-emit-project --all-extras > requirements-audit.txt
          uv run pip-audit --strict -r requirements-audit.txt

      - name: Build package
        if: matrix.python-version == '3.12'
        run: |
          uv build
          uv run twine check dist/*
          uv run python -m venv .artifact-venv
          .artifact-venv/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .artifact-venv/bin/python -c "import geoqc; print(geoqc.__version__)"
          .artifact-venv/bin/geoqc --help

  web:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, type-check, build, and test
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=high
