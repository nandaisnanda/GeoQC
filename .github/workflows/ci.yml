name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # Same command as CONTRIBUTING.md and docs/development.md. The default
      # `dev` group pulls the `dev` extra, which bundles the api/report extras
      # and every test and lint tool, so nothing else is needed here.
      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check for conflict markers
        shell: bash
        run: "! git grep -nE '^(<<<<<<<|>>>>>>>) '"

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest

      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        # geoqc itself is unpublished, so pip-audit can't look it up on
        # PyPI; audit the resolved third-party dependencies only.
        run: |
          uv export --no-hashes --no-emit-project --all-extras > requirements-audit.txt
          uv run pip-audit --strict -r requirements-audit.txt

      - name: Build package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          uv build
          uv run twine check dist/*
          uv run python -m venv .artifact-venv
          .artifact-venv/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .artifact-venv/bin/python -c "import geoqc; print(geoqc.__version__)"
          .artifact-venv/bin/geoqc --help

  # Locks the no-uv setup path documented in CONTRIBUTING.md: a contributor
  # without uv must be able to install with pip and run plain `pytest`.
  python-no-uv:
    name: Python without uv (pip + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install with pip only
        run: pip install -e ".[dev]"

      # Runs the whole suite: `addopts` always enables coverage and the
      # project-wide gate, so a partial selection would fail the gate.
      - name: Plain pytest works
        run: pytest -q

  web:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, type-check, build, and test
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=high
