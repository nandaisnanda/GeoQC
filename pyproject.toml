[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "geoqc"
version = "0.1.0"
description = "Typed GIS quality-control toolkit for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ananda Gunawan" }]
keywords = ["gis", "quality-control", "geospatial", "geopandas", "shapely"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]
dependencies = [
  "geopandas>=1.1,<2",
  "numpy>=2.3,<3",
  "pandas>=2.3,<3",
  "pyarrow>=23.0.1,<24",
  "pyogrio>=0.11,<1",
  "pyproj>=3.7,<4",
  "shapely>=2.1,<3",
  "typer>=0.16,<1",
]

[project.urls]
Documentation = "https://github.com/nandaisnanda/GeoQC#readme"
Issues = "https://github.com/nandaisnanda/GeoQC/issues"
Repository = "https://github.com/nandaisnanda/GeoQC"

[project.scripts]
geoqc = "geoqc.interfaces.cli.main:run"

[project.optional-dependencies]
api = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1"]
report = ["folium>=0.20,<1", "jinja2>=3.1,<4"]
all = ["geoqc[api,report]"]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pandas-stubs>=2.3,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "twine>=6.1,<7",
  "types-shapely>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/geoqc"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=geoqc --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["geoqc"]

[tool.coverage.report]
fail_under = 90
omit = ["*/__init__.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
