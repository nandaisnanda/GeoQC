# Jaringan jalan (road network). Finds dangles, overshoots/undershoots,
# and very short segments that break routing.
# Geometry and topology only: attribute schemas differ between agencies.
# Rules apply to a layer named "jalan"; rename `layer` to match yours.
# Thresholds are in metres (projected CRS, e.g. UTM). Adjust per map scale.
name: jalan
version: 1
preset: road
enabled_checks: [geometry, crs, topology]
expected_geometry_types: [LineString, MultiLineString]
crs:
  required: true
  require_projected: true
  allowed: []
attribute_schema: []
topology_rules:
  - type: singlepart_only
    layer: jalan
    severity: warning
  - type: no_dangles
    layer: jalan
    tolerance: 0.5
    severity: warning
  - type: no_overshoot_undershoot
    layer: jalan
    tolerance: 2.0
  - type: minimum_segment_length
    layer: jalan
    minimum_length: 0.1
    severity: warning
quality_gate:
  minimum_score: 80
  fail_on: error
  allow_unknown_crs: false
